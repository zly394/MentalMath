name: Build & Deploy Web PWA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Compose Web PWA Distribution
        run: ./gradlew :composeApp:jsBrowserDistribution --no-daemon --stacktrace

      - name: Upload PWA Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MentalMath-PWA-dist
          path: composeApp/build/dist/js/productionExecutable/
