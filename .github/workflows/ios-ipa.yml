name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Select Xcode
        run: |
          xcodebuild -version

      - name: Build Kotlin Multiplatform iOS Framework (iosArm64)
        run: |
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Build unsigned iOS App (arm64 device)
        env:
          CI: "true"
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build_ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build_ios/Payload
          cp -r build_ios/Build/Products/Release-iphoneos/iosApp.app build_ios/Payload/
          cd build_ios
          zip -r MentalMath-unsigned.ipa Payload
          cd ..

      - name: Upload iOS unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MentalMath-iOS-unsigned-ipa
          path: build_ios/MentalMath-unsigned.ipa
          if-no-files-found: error
