name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Select Xcode 26.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer
          xcodebuild -version

      - name: Build Kotlin Multiplatform iOS Framework (iosArm64)
        run: |
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Build unsigned iOS App (arm64 device)
        env:
          CI: "true"
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build_ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Package MentalMath-unsigned.ipa
        run: |
          mkdir -p Payload
          cp -r build_ios/Build/Products/Release-iphoneos/MentalMath.app Payload/
          zip -r MentalMath-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MentalMath-unsigned-ipa
          path: MentalMath-unsigned.ipa
