<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1D4ED8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="口算特训">
    <meta name="mobile-web-app-capable" content="yes">
    <title>口算特训</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #F8FAFC;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        #app { width: 100%; height: 100%; }

        /* 弱化后的轻量离线语音状态条与微型胶囊（靠右上角定位，完全不遮挡左侧 Title） */
        #offline-status {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 900;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding-right: max(16px, env(safe-area-inset-right));
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }
        #offline-status[hidden] {
            display: none;
        }
        #offline-status-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2.5px;
            margin: 0;
            border: none;
            background: transparent;
            accent-color: #2563EB;
            z-index: 902;
        }
        #offline-status-progress::-webkit-progress-bar {
            background-color: rgba(226, 232, 240, 0.4);
        }
        #offline-status-progress::-webkit-progress-value {
            background: linear-gradient(90deg, #3B82F6, #1D4ED8);
        }
        .offline-status-pill {
            pointer-events: auto;
            margin-top: max(8px, env(safe-area-inset-top));
            padding: 5px 12px 5px 10px;
            box-sizing: border-box;
            max-width: min(340px, calc(100% - 32px));
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.92);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.8);
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }
        .offline-spinner {
            width: 10px;
            height: 10px;
            border: 1.5px solid rgba(37, 99, 235, 0.2);
            border-top-color: #2563EB;
            border-radius: 50%;
            animation: offline-spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        .offline-spinner[hidden] {
            display: none;
        }
        @keyframes offline-spin {
            to { transform: rotate(360deg); }
        }
        .offline-status-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .offline-status-texts {
            display: flex;
            align-items: center;
            overflow: hidden;
            min-width: 0;
        }
        #offline-status-title {
            font-size: 12px;
            font-weight: 600;
            color: #1E293B;
            white-space: nowrap;
            flex-shrink: 0;
        }
        /* 正常加载态隐藏长文本说明，保持极简微型徽标，彻底不挡 Title */
        #offline-status-detail {
            display: none;
            margin: 0;
            font-size: 11px;
            color: #64748B;
        }
        /* 仅在发生错误需要重试时展示错误细节 */
        .offline-status-pill:has(#offline-status-retry:not([hidden])) #offline-status-detail {
            display: block;
            margin-top: 4px;
            white-space: normal;
            max-width: 100%;
            color: #991B1B;
        }
        #offline-status button {
            border: 0;
            background: transparent;
            color: #1D4ED8;
            font: inherit;
            cursor: pointer;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #offline-status #offline-status-close {
            width: 20px;
            height: 20px;
            padding: 0;
            font-size: 15px;
            line-height: 1;
            border-radius: 50%;
            color: #94A3B8;
            margin-left: 2px;
        }
        #offline-status #offline-status-close:hover {
            color: #475569;
            background: rgba(0, 0, 0, 0.05);
        }
        #offline-status #offline-status-retry {
            padding: 2px 8px;
            min-height: 22px;
            font-size: 11px;
            font-weight: 600;
            background: #2563EB;
            color: #FFFFFF;
            border-radius: 9999px;
        }
        .offline-status-pill:has(#offline-status-retry:not([hidden])) {
            border-radius: 14px;
            padding: 10px 14px;
            max-width: min(400px, calc(100% - 24px));
            flex-wrap: wrap;
            background: #FEF2F2;
            border-color: #FECACA;
        }
        .offline-status-pill:has(#offline-status-retry:not([hidden])) #offline-status-title {
            color: #DC2626;
        }
        .offline-status-pill:has(#offline-status-retry:not([hidden])) #offline-status-detail {
            white-space: normal;
            max-width: 100%;
            color: #991B1B;
        }

        /* 现代化品牌 Splash 启动屏 */
        #boot-status {
            position: fixed;
            inset: 0;
            display: grid;
            place-content: center;
            padding: 24px;
            z-index: 1000;
            background: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .boot-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 320px;
            margin: 0 auto;
            animation: boot-card-in 0.18s ease-out 0.45s both;
        }
        @keyframes boot-card-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #boot-status[role="alert"] .boot-card {
            animation: none;
            opacity: 1;
        }
        .boot-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
            margin-bottom: 12px;
            animation: boot-pulse 2.4s ease-in-out infinite;
        }
        @keyframes boot-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        .boot-app-name {
            font-size: 20px;
            font-weight: 700;
            color: #0F172A;
            letter-spacing: -0.01em;
            margin-bottom: 16px;
        }
        .boot-spinner {
            width: 26px;
            height: 26px;
            border: 2.5px solid #E2E8F0;
            border-top-color: #2563EB;
            border-radius: 50%;
            animation: boot-spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes boot-spin {
            to { transform: rotate(360deg); }
        }
        #boot-status[role="alert"] .boot-spinner {
            display: none;
        }
        #boot-title {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 4px;
        }
        #boot-detail {
            margin: 0;
            font-size: 12px;
            line-height: 1.5;
            color: #64748B;
        }
        #boot-status[role="alert"] #boot-title {
            color: #DC2626;
        }
        #boot-retry {
            margin-top: 16px;
            padding: 8px 22px;
            min-height: 38px;
            border: 0;
            border-radius: 9999px;
            background: #2563EB;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: background 0.15s, transform 0.1s;
        }
        #boot-retry:hover {
            background: #1D4ED8;
        }
        #boot-retry:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <aside id="offline-status" role="status" aria-live="polite" aria-atomic="true" hidden>
        <progress id="offline-status-progress" max="1" aria-label="离线语音模型加载进度"></progress>
        <div class="offline-status-pill">
            <span class="offline-status-icon" aria-hidden="true" id="offline-status-icon-wrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                    <path d="M5 10a7 7 0 0 0 14 0"></path>
                    <line x1="12" y1="19" x2="12" y2="22"></line>
                    <line x1="8" y1="22" x2="16" y2="22"></line>
                </svg>
            </span>
            <div class="offline-spinner" id="offline-status-spinner"></div>
            <div class="offline-status-texts">
                <strong id="offline-status-title"></strong>
                <p id="offline-status-detail"></p>
            </div>
            <button id="offline-status-retry" type="button" hidden>重试加载</button>
            <button id="offline-status-close" type="button" aria-label="收起离线加载提示">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </aside>
    <div id="boot-status" role="status">
        <div class="boot-card">
            <img class="boot-logo" src="icon-192.png" alt="口算特训" width="64" height="64">
            <div class="boot-app-name">口算特训</div>
            <div class="boot-spinner" aria-hidden="true"></div>
            <strong id="boot-title">正在获取启动程序……</strong>
            <p id="boot-detail">正在准备应用资源。</p>
            <button id="boot-retry" type="button" hidden>重新加载</button>
        </div>
    </div>
    <script src="startup.js"></script>
    <script defer src="offline-speech.js"></script>
    <script defer src="speech.js"></script>
    <script defer src="speech-diagnostics.js"></script>
    <script defer src="offline-status.js"></script>
    <script>
        if (window.isSecureContext && 'serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js').catch(function (error) {
                    console.error('Service Worker registration failed:', error);
                });
            });
        }
    </script>
    <script defer src="mentalmath.js" onload="window.mentalMathStartup?.programLoaded()" onerror="window.showStartupError?.(new Error('mentalmath.js 加载失败'))"></script>
</body>
</html>
